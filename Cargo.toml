[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
image = "0.25.2"
png = "0.18"
tiff = "0.11"
shapefile = "0.9.0"
indicatif = "0.18.6"
serde_json = "1.0.150"
gdal = { version = "0.19.0", features = ["ndarray"] }
gdal-src = { version = "0.3.0", features = ["geos", "internal_drivers"] }
gdal-sys = { version = "0.12.0", features = ["bundled"] }
clap = { version = "4.6.2", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "display"] }
