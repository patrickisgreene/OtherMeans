[workspace]
resolver = "3"
members = ["libraries/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
num = "0.4"
ron = "0.12"
png = "0.18"
gag = "1"
glam = "0.32"
tiff = "0.11"
slab = "0.4.9"
smol_str = { version = "0.2.2", features = ["serde"] }
image = "0.25.2"
rayon = "1.10.0"
ndarray = "0.17"
indexmap = "2"

bytemuck = "1.14"
bitflags = "2.13"
itertools = "0.15"
shapefile = "0.9.0"
thiserror = "2.0.18"
serde_json = "1.0.150"
thread_local = "1.1.8"
async-channel = "2.1"
bevy = { version = "0.19", default-features = false }
gdal = { version = "0.19.0", features = ["ndarray"] }
serde = { version = "1.0.228", features = ["derive"] }
indicatif = { version = "0.17.8", features = ["rayon"] }
gdal-src = { version = "0.3.0", features = ["geos", "internal_drivers"] }
gdal-sys = { version = "0.12.0", features = ["bundled"] }
clap = { version = "4.6.2", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "display"] }

# TODO: Switch back to the official repository after the release.
#big_space = { version = "0.12.0", features = ["i32"] }
big_space = { git = "https://github.com/m-edlund/big_space", features = ["i32"], branch = "bevy-0.19" }
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
bevy-inspector-egui = "0.37"

airplanes.path = "libraries/airplanes"
buildings.path = "libraries/buildings"
camera.path = "libraries/camera"
earth.path = "libraries/earth"
cities.path = "libraries/cities"
labels.path = "libraries/labels"
roads.path = "libraries/roads"
terrain.path = "libraries/terrain"
metrics.path = "libraries/metrics"
weapons.path = "libraries/weapons"
scenario.path = "libraries/scenario"
automobiles.path = "libraries/automobiles"
workspace.path = "libraries/workspace"
shipping.path = "libraries/shipping"
shipping-lanes.path = "libraries/shipping-lanes"
terrain-processor.path = "libraries/terrain-preprocess"
texture-processor.path = "libraries/texture-processor"

# Keep the workspace's own crates fast to recompile, but optimize dependencies
# (Bevy, big_space, etc.) where almost all per-frame CPU cost actually lives
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
